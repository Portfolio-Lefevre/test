<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio Lola Lefevre</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #e8e8e8;
    }

    #pdf-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    #pdf-container {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
    }

    .pdf-page {
      width: 100%;
      margin: 0 auto 2px auto;
      background: white;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: white;
    }

    #loading {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    #toolbar {
      display: none;
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 1000;
      gap: 6px;
      padding: 6px;
      background: rgba(255,255,255,0.94);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    #toolbar button {
      border: 0;
      background: #111;
      color: #fff;
      height: 38px;
      min-width: 38px;
      padding: 0 10px;
      border-radius: 5px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 15px;
    }

    #zoomReset {
      min-width: 64px !important;
    }
  </style>
</head>

<body>

<div id="toolbar">
  <button id="zoomOut" aria-label="Dézoomer">−</button>
  <button id="zoomReset">100%</button>
  <button id="zoomIn" aria-label="Zoomer">+</button>
</div>

<div id="loading">Chargement du portfolio…</div>

<div id="pdf-wrapper">
  <div id="pdf-container"></div>
</div>

<script>
  const pdfUrl = "Portfolio.pdf";

  /*
   * MOBILE
   * Ouverture directe du PDF.
   * Aucun PDF.js n'est chargé.
   */
  const isMobile =
    window.matchMedia("(max-width: 767px)").matches ||
    /Android|iPhone|iPod/i.test(navigator.userAgent);

  if (isMobile) {

    window.location.replace(pdfUrl);

  } else {

    /*
     * PDF.js n'est chargé que sur ordinateur.
     */
    const script = document.createElement("script");

    script.src =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";

    script.onload = initPortfolio;

    script.onerror = function() {
      document.getElementById("loading").innerHTML =
        '<a href="Portfolio.pdf">Ouvrir le portfolio PDF</a>';
    };

    document.head.appendChild(script);
  }


  async function initPortfolio() {

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

    const container =
      document.getElementById("pdf-container");

    const wrapper =
      document.getElementById("pdf-wrapper");

    const loading =
      document.getElementById("loading");

    const toolbar =
      document.getElementById("toolbar");

    const zoomReset =
      document.getElementById("zoomReset");

    let pdf;
    let zoom = 1;

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 3;
    const ZOOM_STEP = 0.25;

    const pages = [];
    const rendering = new Set();


    /*
     * Résolution du canvas.
     *
     * 2000 px à l'affichage normal.
     * Elle augmente avec le zoom.
     * Limite absolue : 4000 px pour éviter
     * les canvas gigantesques et les bugs mémoire.
     */
    function getTargetWidth() {

      const normalWidth = Math.min(
        window.innerWidth * window.devicePixelRatio,
        2000
      );

      return Math.min(
        normalWidth * zoom,
        4000
      );
    }


    async function renderPage(pageNumber, force = false) {

      const item = pages[pageNumber - 1];

      if (!item || rendering.has(pageNumber)) {
        return;
      }

      const targetWidth = getTargetWidth();

      /*
       * Ne rerend pas inutilement une page
       * qui possède déjà une définition suffisante.
       */
      if (
        !force &&
        item.renderedWidth >= targetWidth * 0.95
      ) {
        return;
      }

      rendering.add(pageNumber);

      try {

        const page =
          await pdf.getPage(pageNumber);

        const baseViewport =
          page.getViewport({ scale: 1 });

        const scale =
          targetWidth / baseViewport.width;

        const viewport =
          page.getViewport({ scale });

        const canvas =
          document.createElement("canvas");

        const context =
          canvas.getContext("2d", {
            alpha: false
          });

        canvas.width =
          Math.floor(viewport.width);

        canvas.height =
          Math.floor(viewport.height);

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;

        item.holder.replaceChildren(canvas);

        item.renderedWidth =
          targetWidth;

      } catch (error) {

        console.error(
          "Erreur page " + pageNumber,
          error
        );

      } finally {

        rendering.delete(pageNumber);
      }
    }


    /*
     * Rend seulement les pages proches
     * de la zone actuellement consultée.
     */
    function renderNearbyPages(force = false) {

      pages.forEach(function(item, index) {

        const rect =
          item.holder.getBoundingClientRect();

        if (
          rect.bottom > -1500 &&
          rect.top < window.innerHeight + 2500
        ) {

          renderPage(
            index + 1,
            force
          );
        }
      });
    }


    /*
     * ZOOM
     *
     * La largeur physique augmente immédiatement.
     * Seules les pages proches sont ensuite
     * recalculées en meilleure définition.
     */
    function applyZoom() {

      container.style.width =
        (zoom * 100) + "%";

      container.style.maxWidth =
        (1600 * zoom) + "px";

      zoomReset.textContent =
        Math.round(zoom * 100) + "%";

      renderNearbyPages(false);
    }


    document.getElementById("zoomIn").onclick =
      function() {

        if (zoom >= MAX_ZOOM) return;

        zoom =
          Math.min(
            MAX_ZOOM,
            zoom + ZOOM_STEP
          );

        applyZoom();
      };


    document.getElementById("zoomOut").onclick =
      function() {

        if (zoom <= MIN_ZOOM) return;

        zoom =
          Math.max(
            MIN_ZOOM,
            zoom - ZOOM_STEP
          );

        applyZoom();
      };


    document.getElementById("zoomReset").onclick =
      function() {

        zoom = 1;

        container.style.width = "100%";
        container.style.maxWidth = "1600px";

        zoomReset.textContent = "100%";

        wrapper.scrollLeft = 0;
      };


    try {

      pdf =
        await pdfjsLib.getDocument(pdfUrl).promise;

      /*
       * Dimensions de référence.
       */
      const firstPage =
        await pdf.getPage(1);

      const firstViewport =
        firstPage.getViewport({ scale: 1 });


      /*
       * Réserve immédiatement l'emplacement
       * de toutes les pages.
       */
      for (
        let i = 1;
        i <= pdf.numPages;
        i++
      ) {

        const holder =
          document.createElement("div");

        holder.className =
          "pdf-page";

        holder.style.aspectRatio =
          firstViewport.width +
          " / " +
          firstViewport.height;

        container.appendChild(holder);

        pages.push({
          holder: holder,
          renderedWidth: 0
        });
      }


      /*
       * PRIORITÉ :
       * couverture.
       */
      await renderPage(1);

      loading.style.display =
        "none";

      toolbar.style.display =
        "flex";


      /*
       * Précharge immédiatement les
       * quatre pages suivantes.
       */
      for (
        let i = 2;
        i <= Math.min(5, pdf.numPages);
        i++
      ) {
        renderPage(i);
      }


      /*
       * Préchargement progressif pendant
       * la consultation.
       */
      let scrollTimer;

      window.addEventListener(
        "scroll",
        function() {

          clearTimeout(scrollTimer);

          scrollTimer =
            setTimeout(
              function() {
                renderNearbyPages(false);
              },
              80
            );
        },
        {
          passive: true
        }
      );


      /*
       * Premier préchargement.
       */
      renderNearbyPages(false);


    } catch (error) {

      console.error(error);

      loading.innerHTML =
        '<a href="Portfolio.pdf">Ouvrir le portfolio PDF</a>';
    }
  }
</script>

</body>
</html>
